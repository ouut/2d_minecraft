<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Minecraft 3D - Voxel Engine Web Client (WebGL / Macroquad)</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #87ceeb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #glcanvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            cursor: crosshair;
        }
        #overlay {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            color: #ffffff;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            pointer-events: none;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: opacity 0.5s ease;
        }
        #overlay kbd {
            background: #333;
            border: 1px solid #555;
            border-radius: 3px;
            padding: 1px 4px;
            font-family: monospace;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div id="overlay">
        <span>🎮 <kbd>Click</kbd> Capture Mouse | <kbd>WASD</kbd> Move | <kbd>Space</kbd> Jump | <kbd>V</kbd> 3D/2.5D View | <kbd>1-9</kbd> Hotbar</span>
    </div>
    <canvas id="glcanvas" tabindex='1'></canvas>

    <script src="gl.js?v=0.2.1"></script>
    <script src="sapp_jsutils.js?v=0.2.1"></script>
    <script src="quad-net.js?v=0.2.1"></script>
    <script>
        const canvas = document.getElementById("glcanvas");
        const overlay = document.getElementById("overlay");

        // Native DOM Pointer Lock triggered by genuine user gesture
        canvas.addEventListener("click", () => {
            canvas.focus();
            if (document.pointerLockElement !== canvas) {
                try {
                    const p = canvas.requestPointerLock();
                    if (p && p.catch) {
                        p.catch(() => {});
                    }
                } catch (e) {}
            }
        });

        document.addEventListener("pointerlockchange", () => {
            if (document.pointerLockElement === canvas) {
                if (overlay) overlay.style.opacity = "0.2";
            } else {
                if (overlay) overlay.style.opacity = "1";
            }
        });

        load("voxel_web.wasm?v=0.2.1");
    </script>
</body>
</html>
