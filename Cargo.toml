[workspace]
resolver = "2"
members = [
    "crates/voxel_core",
    "crates/voxel_gen",
    "crates/voxel_sim",
    "crates/voxel_ecs",
    "crates/voxel_script",
    "crates/voxel_render",
    "crates/voxel_app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
voxel_core = { path = "crates/voxel_core" }
voxel_gen = { path = "crates/voxel_gen" }
voxel_sim = { path = "crates/voxel_sim" }
voxel_ecs = { path = "crates/voxel_ecs" }
voxel_script = { path = "crates/voxel_script" }
voxel_render = { path = "crates/voxel_render" }
macroquad = "0.4.16"
flecs_ecs = { git = "https://github.com/Indra-db/Flecs-Rust" }
noise = "0.9.0"
rand = "0.8"
steel-core = "0.8.3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
