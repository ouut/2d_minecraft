[workspace]
resolver = "2"
members = [
    "crates/voxel_core",
    "crates/voxel_gen",
    "crates/voxel_sim",
    "crates/voxel_ecs",
    "crates/voxel_script",
    "crates/voxel_render",
    "crates/voxel_app",
    "crates/game_net",
    "crates/game_server",
    "crates/game_script",
]

[workspace.package]
version = "0.2.0"
edition = "2021"

[workspace.dependencies]
voxel_core = { path = "crates/voxel_core" }
voxel_gen = { path = "crates/voxel_gen" }
voxel_sim = { path = "crates/voxel_sim" }
voxel_ecs = { path = "crates/voxel_ecs" }
voxel_script = { path = "crates/voxel_script" }
voxel_render = { path = "crates/voxel_render" }
game_net = { version = "0.2.0", path = "crates/game_net" }
game_server = { version = "0.2.0", path = "crates/game_server" }
game_script = { version = "0.2.0", path = "crates/game_script" }
macroquad = "0.4.16"
flecs_ecs = { git = "https://github.com/Indra-db/Flecs-Rust" }
noise = "0.9.0"
rand = "0.8"
steel-core = "0.8.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1.0", features = ["alloc"] }
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace", "compression-full"] }
dashmap = "5.5"
futures-util = "0.3"
uuid = { version = "1.8", features = ["v4", "serde"] }
crossbeam-queue = "0.3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
