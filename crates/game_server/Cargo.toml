[package]
name = "game_server"
version.workspace = true
edition.workspace = true
description = "Universal game server session gateway with Axum HTTP static WASM serving and WebSocket"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ouut/2d_minecraft"
readme = "README.md"
keywords = ["game", "server", "websocket", "session", "axum"]
categories = ["game-development", "network-programming"]

[dependencies]
game_net = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
dashmap = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
crossbeam-queue = { workspace = true }

[[bin]]
name = "voxel_server"
path = "src/bin/server.rs"

[dev-dependencies]
tokio-tungstenite = "0.24"
